# Starship prompt — Ember theme

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_status\
$python\
$conda\
$julia\
$rlang\
$fortran\
$golang\
$rust\
$haskell\
$zig\
$nix_shell\
$c\
$lua\
$nodejs\
$bun\
$deno\
$java\
$docker_context\
$jobs\
$cmd_duration\
$status\
$line_break\
$character"""

right_format = """$sudo$direnv$memory_usage$aws$gcloud$azure$kubernetes$battery$time"""

#------system-info
command_timeout = 1150

[package]
disabled = true

[character]
success_symbol = "[❯](bold #8a9868)"
error_symbol = "[❯](bold #e08060)"

[directory]
style = "bold #c8b468"
truncation_length = 0
truncate_to_repo = false
read_only = " 󰌾 "
read_only_style = "bold #e08060"

[status]
disabled = false
style = "bold #b07878"
format = "[$symbol$status($common_meaning)]($style) "
symbol = "✘ "
map_symbol = true
not_found_symbol = "[󱪼](#4a4842) [ :](#d8d0c0) "
sigint_symbol = "[󱪼](#4a4842) [ ](#d8d0c0):"
signal_symbol = "[󱪼](#4a4842) [ ](#e08060):"

[cmd_duration]
min_time = 1500
style = "bold #988090"
format = "[󰔟 $duration]($style) "
show_milliseconds = true

[jobs]
symbol = " "
style = "bold #d8d0c0"
format = "[$symbol$number]($style) "
threshold = 1

[username]
style_user = "bold #988090"
style_root = "bold #e08060"
format = "[$user]($style)[ @ ](#4a4842)"
show_always = false
disabled = false

[hostname]
ssh_only = false
style = "bold #7890a0"
format = "[ ](#d8d0c0)[ 󰇐 ](#4a4842)"
disabled = false

[sudo]
disabled = false
symbol = "  "
style = "bold #e08060"
format = "[$symbol]($style) [󱪼](#4a4842)"

[direnv]
disabled = false
symbol = " "
style = "bold #c8b468"
format = "[$symbol$loaded( $allowed)]($style) [󱪼](#4a4842) "
detect_extensions = []
detect_files = [".envrc"]

[battery]
full_symbol = "  "
charging_symbol = "  "
discharging_symbol = " "
unknown_symbol = " 󰂑 "
empty_symbol = " 󱉞 "

[[battery.display]]
threshold = 20
style = "bold #e08060"

[[battery.display]]
threshold = 65
style = "bold #c09058"

[memory_usage]
disabled = false
threshold = 75
symbol = "󰍛 "
style = "bold #e08060"
format = "[$symbol${ram}(${swap})]($style) [󱪼](#4a4842)"

[time]
disabled = false
format = "[$time]($style)"
style = "bold #988090"
time_format = "%H:%M:%S%.3f"


#------cloud-services


[aws]
disabled = false
symbol = "󰅟  "
style = "bold #c09058"
format = "[{](#4a4842)[$symbol($profile)($region)]($style)[}](#4a4842)[󱪼](#4a4842) "

[gcloud]
disabled = false
symbol = "️󱇶  "
style = "bold #7890a0"
format = "[{](#4a4842)[$symbol$project($region)]($style)[}](#4a4842)[󱪼](#4a4842) "

[azure]
disabled = false
symbol = "󰏊 󰠅 "
style = "bold #7890a0"
format = "[{](#4a4842)[$symbol($subscription)]($style)[}](#4a4842)[󱪼](#4a4842) "

[kubernetes]
disabled = false
symbol = " 󰠳  "
style = "bold #80a090"
format = "[{](#4a4842)[$symbol$context($namespace)]($style)[}](#4a4842)[󱪼](#4a4842) "
#------git

[git_branch]
symbol = ""
style = "bold #7890a0"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold #c09058"
format = '([$all_status$ahead_behind]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "󰀦 ${count}"
deleted = "󰆴 ${count}"
modified = "󰤌 ${count}"
renamed = "󰕍 ${count}"
staged = "󰐗 ${count}"
untracked = "󱇰 ${count}"
stashed = "󰆼 ${count}"

[git_commit]
style = "bold #c09058"
format = "[\\($hash$tag\\)]($style) "
commit_hash_length = 7
only_detached = true
tag_disabled = false
tag_symbol = " 󰓹 "

#------languages/packages

[python]
symbol = "󱔎 "
style = "bold #8a9868"
format = '[{](#4a4842)[${symbol}${pyenv_prefix}(${version})(\($virtualenv\) )]($style)[}](#4a4842)'
detect_extensions = ["py"]
detect_files = ["requirements.txt", "setup.py", "pyproject.toml", "Pipfile", ".python-version"]

[conda]
symbol = " "
style = "bold #8a9868"
format = "[{](#4a4842)[$symbol$environment]($style)[}](#4a4842)"
ignore_base = true

[golang]
symbol = "󰟓 "
style = "bold #7890a0"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[rust]
symbol = " "
style = "bold #b07878"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[c]
symbol = " "
style = "bold #988090"
format = "[{](#4a4842)[$symbol($version(-$name))]($style)[}](#4a4842)"
detect_extensions = ["c", "h", "cpp", "hpp"]

[lua]
symbol = " "
style = "bold #80a090"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[nodejs]
symbol = " "
style = "bold #8a9868"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"
detect_extensions = ["js", "ts", "mjs"]
detect_files = ["package.json"]

[java]
symbol = " "
style = "bold #c09058"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[docker_context]
symbol = " "
style = "bold #80a090"
format = "[{](#4a4842)[$symbol$context]($style)[}](#4a4842)"
only_with_files = true

[julia]
symbol = " "
style = "bold #8a9868"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[rlang]
symbol = "󰟔 "
style = "bold #7890a0"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[fortran]
symbol = " "
style = "bold #988090"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[haskell]
symbol = "λ "
style = "bold #80a090"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[zig]
symbol = " "
style = "bold #c8b468"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"

[nix_shell]
symbol = "❄️ "
style = "bold #7890a0"
format = '[{](#4a4842)[$symbol$state( \($name\))]($style)[}](#4a4842)'

[bun]
symbol = " "
style = "bold #c09058"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"


[deno]
symbol = "🦕 "
style = "bold #80a090"
format = "[{](#4a4842)[$symbol($version)]($style)[}](#4a4842)"
detect_files = ["deno.json", "deno.jsonc"]
detect_extensions = []

